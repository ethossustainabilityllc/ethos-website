      <button class="menu-toggle" type="button" aria-label="Open menu" aria-controls="drawer" aria-expanded="false" data-menu-open><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M19 8H5a1 1 0 1 1 0-2h14a1 1 0 0 1 0 2zm0 5.097H5a1 1 0 1 1 0-2h14a1 1 0 1 1 0 2zm0 5.25H5a1 1 0 1 1 0-2h14a1 1 0 1 1 0 2z"></path></svg></button>

    <div class="drawer" id="drawer" aria-hidden="true">
      <button class="drawer__close" type="button" aria-label="Close menu" data-menu-close><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M19.245 4.313a1.065 1.065 0 0 0-1.508 0L11.78 10.27 5.82 4.313A1.065 1.065 0 1 0 4.312 5.82l5.958 5.958-5.958 5.959a1.067 1.067 0 0 0 1.508 1.508l5.959-5.958 5.958 5.958a1.065 1.065 0 1 0 1.508-1.508l-5.958-5.959 5.958-5.958a1.065 1.065 0 0 0 0-1.508"></path></svg></button>

  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="row">
          <div class="col col-narrow">
            <form id="contact-form" novalidate>
              <h1 class="form-title">ETHOS Sustainability</h1>
              <div class="field">
                <input type="text" id="cf-name" name="name" placeholder=" " required autocomplete="name">
                <label for="cf-name">Name*</label>
              </div>
              <div class="field">
                <input type="email" id="cf-email" name="email" placeholder=" " required autocomplete="email">
                <label for="cf-email">Email*</label>
              </div>
              <div class="field">
                <input type="tel" id="cf-phone" name="phone" placeholder=" " autocomplete="tel">
                <label for="cf-phone">Phone Number (optional)</label>
              </div>
              <div class="field field--textarea">
                <label class="visually-hidden" for="cf-message">Message</label>
                <textarea id="cf-message" name="message" placeholder="Message"></textarea>
              </div>
              <div class="form-actions">
                <button class="btn btn--light" type="submit">Send</button>
              </div>
            </form>
          </div>
        </div>
        <div class="row contact-info">
          <div class="col col-narrow">
            <p><a href="mailto:bill@ethossustainability.com">bill@ethossustainability.com</a></p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer site-footer--white">
    <div class="container">
      <div class="site-footer__row">
